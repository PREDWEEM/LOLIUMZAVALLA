name: Copiar meteorología exacta multisitio LOLIUM

on:
  workflow_dispatch:
  schedule:
    # Todos los días a las 07:30 de Argentina (10:30 UTC).
    - cron: '30 10 * * *'

permissions:
  contents: write

concurrency:
  group: copia-exacta-meteo-lolium-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREDWEEM_REPOS_TOKEN: ${{ secrets.PREDWEEM_REPOS_TOKEN }}

    steps:
      - name: Descargar repositorio multisitio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia
        run: python -m pip install requests

      - name: Verificar token de repositorios
        run: |
          if [ -z "$PREDWEEM_REPOS_TOKEN" ]; then
            echo "::error::Falta el secreto PREDWEEM_REPOS_TOKEN."
            exit 1
          fi

      - name: Copiar exactamente meteo_daily.csv de cada repositorio
        run: python update_meteo.py

      - name: Verificar identidad byte por byte
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from sitios_lolium import DEFAULT_SITE_SLUG, ordered_sites

          state_path = Path("data/estado_actualizacion_meteo.json")
          if not state_path.is_file():
              raise SystemExit("No se generó el estado de actualización.")

          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state.get("modo") != "COPIA_EXACTA_METEO_DAILY":
              raise SystemExit("La actualización no quedó en modo de copia exacta.")

          for site in ordered_sites():
              path = site.meteo_path(".")
              if not path.is_file():
                  raise SystemExit(f"No se generó {path}")

              content = path.read_bytes()
              digest = hashlib.sha256(content).hexdigest()
              site_state = state.get("sitios", {}).get(site.slug, {})

              if not site_state.get("copia_exacta"):
                  raise SystemExit(f"{site.nombre}: copia exacta no confirmada.")
              if digest != site_state.get("sha256"):
                  raise SystemExit(f"{site.nombre}: el hash SHA-256 no coincide.")
              if len(content) != int(site_state.get("bytes", -1)):
                  raise SystemExit(f"{site.nombre}: el tamaño no coincide.")

              print(site.nombre, path, len(content), digest)

          default_site = next(
              site for site in ordered_sites()
              if site.slug == DEFAULT_SITE_SLUG
          )
          root_digest = hashlib.sha256(
              Path("meteo_daily.csv").read_bytes()
          ).hexdigest()
          default_digest = hashlib.sha256(
              default_site.meteo_path(".").read_bytes()
          ).hexdigest()
          if root_digest != default_digest:
              raise SystemExit(
                  "meteo_daily.csv raíz no coincide exactamente con Zavalla."
              )
          PY

      - name: Guardar actualización diaria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add meteo_daily.csv data/meteo_sitios data/estado_actualizacion_meteo.json

          if git diff --cached --quiet; then
            echo "Los archivos originales no cambiaron."
            exit 0
          fi

          git commit -m "Copia exacta diaria de meteo_daily multisitio"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
