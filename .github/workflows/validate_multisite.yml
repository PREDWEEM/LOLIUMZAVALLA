name: Validar estructura multisitio

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "app_*.py"
      - "config_multisitio.py"
      - "sitios_lolium.py"
      - "predweem_core.py"
      - "visualizacion_*.py"
      - "mapa_sitios.py"
      - "tests/test_multisitio_registry.py"
      - ".github/workflows/validate_multisite.yml"
  pull_request:
    paths:
      - "app.py"
      - "app_*.py"
      - "config_multisitio.py"
      - "sitios_lolium.py"
      - "predweem_core.py"
      - "visualizacion_*.py"
      - "mapa_sitios.py"
      - "tests/test_multisitio_registry.py"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio multisitio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pruebas
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validar sintaxis de la aplicación
        run: |
          python -m py_compile \
            app.py \
            app_multisitio.py \
            app_multisitio_principal.py \
            app_fuente_hibrida.py \
            app_detalle_1pct.py \
            app_umbral_operativo.py \
            app_zoom_operativo.py \
            config_multisitio.py \
            sitios_lolium.py \
            predweem_core.py \
            visualizacion_operativa.py \
            visualizacion_pulsos.py \
            mapa_sitios.py

      - name: Verificar estructura depurada y nueve localidades
        run: python -m pytest tests/test_multisitio_registry.py -q
