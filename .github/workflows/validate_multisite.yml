name: Validar estructura multisitio

on:
  workflow_dispatch:
  push:
    paths:
      - "sitios_lolium.py"
      - "app.py"
      - "app_multisitio.py"
      - "app_multisitio_principal.py"
      - "tests/test_multisitio_registry.py"
      - ".github/workflows/validate_multisite.yml"
  pull_request:
    paths:
      - "sitios_lolium.py"
      - "app.py"
      - "app_multisitio.py"
      - "app_multisitio_principal.py"
      - "tests/test_multisitio_registry.py"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio multisitio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pruebas
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verificar las nueve localidades
        run: python -m pytest tests/test_multisitio_registry.py -q
