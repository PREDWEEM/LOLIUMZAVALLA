name: Validar PREDWEEM Zavalla

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compilar módulos
        run: |
          python -m py_compile \
            app.py \
            predweem_core.py \
            selector_adaptativo.py \
            visualizacion_pulsos.py \
            update_meteo.py \
            config_zavalla.py \
            sitios_lolium.py

      - name: Ejecutar pruebas
        run: pytest -q
