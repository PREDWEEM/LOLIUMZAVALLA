name: Mantener Streamlit disponible

on:
  schedule:
    # Streamlit Community Cloud hiberna las apps sin tráfico durante 12 horas.
    # Se ejecuta cada 6 horas y en un minuto no redondo para reducir congestión.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-availability-check
  cancel-in-progress: true

jobs:
  visit-streamlit-app:
    name: Abrir aplicación PREDWEEM con Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright y Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Abrir Streamlit y mantener la sesión activa
        env:
          APP_URL: "https://f8d5dqg4evu9tvthrrffkl.streamlit.app/"
          KEEPALIVE_ARTIFACT_DIR: "keepalive-artifacts"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/keep_streamlit_awake.py

      - name: Guardar diagnóstico del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-keepalive-${{ github.run_id }}
          path: keepalive-artifacts/
          if-no-files-found: warn
          retention-days: 7
